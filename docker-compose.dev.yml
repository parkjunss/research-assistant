# docker-compose.dev.yml
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"   # 외부:5433 → 컨테이너 내부:5432
    environment:
      POSTGRES_DB: research_db
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev